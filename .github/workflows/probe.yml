name: probe (temporary)
on: workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: which endpoints answer from a US runner
        run: |
          for u in \
            "https://data-api.binance.vision/api/v3/ticker/price?symbol=BTCUSDT" \
            "https://fapi.binance.com/fapi/v1/premiumIndex?symbol=BTCUSDT" \
            "https://api.bybit.com/v5/market/tickers?category=linear&symbol=BTCUSDT" \
            "https://www.okx.com/api/v5/public/funding-rate?instId=BTC-USDT-SWAP" \
            "https://api.deribit.com/api/v2/public/get_index_price?index_name=btc_usd" \
            "https://api.coingecko.com/api/v3/derivatives" \
            "https://api.kraken.com/0/public/Ticker?pair=XBTUSD" \
            "https://futures.kraken.com/derivatives/api/v3/tickers" \
            "https://api.hyperliquid.xyz/info" \
            "https://api.bitget.com/api/v2/mix/market/ticker?symbol=BTCUSDT&productType=usdt-futures" \
            "https://api.gateio.ws/api/v4/futures/usdt/contracts/BTC_USDT" \
            "https://www.bitmex.com/api/v1/instrument?symbol=XBTUSD&count=1&reverse=true" \
            "https://api.coinmarketcap.com/data-api/v3/cryptocurrency/derivatives?slug=bitcoin" \
            ; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 12 "$u")
            echo "$code  $u"
          done
