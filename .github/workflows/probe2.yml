name: probe2
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: data.binance.vision reachability
        run: |
          set +e
          for d in 2026-11-20 2026-11-24 2026-11-25; do
            u="https://data.binance.vision/data/futures/um/daily/klines/BTCUSDT/1h/BTCUSDT-1h-$d.zip"
            echo "RESULT $(curl -s -o /tmp/x.zip -w '%{http_code}' --max-time 20 "$u") fut-daily-$d $(stat -c%s /tmp/x.zip 2>/dev/null)"
          done
          u="https://data.binance.vision/data/futures/um/monthly/klines/BTCUSDT/1h/BTCUSDT-1h-2026-10.zip"
          echo "RESULT $(curl -s -o /tmp/y.zip -w '%{http_code}' --max-time 25 "$u") fut-monthly-2026-10 $(stat -c%s /tmp/y.zip 2>/dev/null)"
          echo "RESULT $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://data.binance.vision/data/spot/daily/klines/BTCUSDT/1h/BTCUSDT-1h-2026-11-25.zip") spot-daily-25"
