name: Salam Protocol — On-Demand & Every 4H

on:
  workflow_dispatch:            # "Run workflow" button
  schedule:
    - cron: '0 */4 * * *'

permissions:
  contents: write

concurrency:
  group: salam-packet
  cancel-in-progress: false

jobs:
  build-packet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No pip install: the script is standard library only.
      - name: Self-tests (maths + cross-venue agreement)
        run: python3 salam_protocol.py --selftest

      - name: Build the Salam packet
        run: python3 salam_protocol.py --json

      - name: Publish readable copy for GitHub Pages
        run: |
          mkdir -p docs
          cp SALAM_DATA_HUB.md SALAM_DATA_HUB.json docs/

      - name: Show packet in the run summary
        run: cat SALAM_DATA_HUB.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SALAM_DATA_HUB.md SALAM_DATA_HUB.json docs/SALAM_DATA_HUB.md docs/SALAM_DATA_HUB.json
          if git diff --cached --quiet; then
            echo "no change — nothing to publish"
            exit 0
          fi
          git commit -m "data: salam packet $(date -u +%Y-%m-%dT%H:%MZ)"
          # A push can be rejected when anything else lands on master in the same second —
          # a hand-pushed commit, or two dispatches racing. Observed on run 45794560094:
          # "! [rejected] master -> master (fetch first)" and the packet was lost. Rebase and
          # retry rather than failing the publish.
          for attempt in 1 2 3 4; do
            if git pull --rebase --autostash origin master && git push; then
              echo "published on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — retrying after rebase"
            sleep $((attempt * 5))
          done
          echo "::error::could not publish the packet after 4 attempts"
          exit 1
