name: Salam Protocol — On-Demand & Every 4H

on:
  workflow_dispatch:            # "Run workflow" button
  schedule:
    - cron: '0 */4 * * *'

permissions:
  contents: write

concurrency:
  group: salam-packet
  cancel-in-progress: false

jobs:
  build-packet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No pip install: the script is standard library only.
      - name: Self-tests (maths + cross-venue agreement)
        run: python3 salam_protocol.py --selftest

      - name: Build the Salam packet
        run: python3 salam_protocol.py --json

      - name: Publish readable copy for GitHub Pages
        run: |
          mkdir -p docs
          cp SALAM_DATA_HUB.md SALAM_DATA_HUB.json docs/

      - name: Show packet in the run summary
        run: cat SALAM_DATA_HUB.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the packet
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES="SALAM_DATA_HUB.md SALAM_DATA_HUB.json docs/SALAM_DATA_HUB.md docs/SALAM_DATA_HUB.json"

          # Two packets can be built at the same time (a scheduled run and a dispatch, or a
          # dispatch and a human push). Rebase-and-retry is not enough: both runs modify the same
          # four files, so the rebase conflicts and the retry loop spins — observed on run
          # 45794838118, four rejections in a row. Instead, move HEAD onto the remote tip while
          # keeping the freshly built files, and commit them strictly on top of it.
          publish () {
            git fetch --quiet origin master
            git reset --soft origin/master
            git add $FILES
            if git diff --cached --quiet; then
              echo "nothing new to publish — the remote already carries this packet"
              return 0
            fi
            git commit -q -m "data: salam packet $(date -u +%Y-%m-%dT%H:%MZ)"
            git push --quiet origin master
          }

          for attempt in 1 2 3 4; do
            if publish; then
              echo "published on attempt $attempt"
              exit 0
            fi
            echo "publish attempt $attempt lost the race — rebuilding the commit on the new tip"
            sleep $((attempt * 4))
          done
          echo "::error::could not publish the packet after 4 attempts"
          exit 1
